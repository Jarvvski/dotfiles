[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["fd", "bat"]

[source]
command = [
  { name = "Default", run = "fd -t f" },
  { name = "Hidden",  run = "fd -t f -H" },
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
f12 = "actions:edit"
f11 = "actions:open_zed"
f10 = "actions:copy_path"
ctrl-up = "actions:goto_parent_dir"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
command = "${EDITOR:-vim} {}"
shell = "bash"
# use `mode = "fork"` if you want to return to tv afterwards
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv files .."
mode = "execute"

[actions.open_zed]
description = "Open the selected entries in Zed"
command = "zed {split:\\n:..|map:{append:'|prepend:'}|join: }"
mode = "fork"
separator = "\n"

[actions.copy_path]
description = "Copy the selected file path(s) to the clipboard"
command = "printf '%s\\n' {split:\\n:..|map:{append:'|prepend:'}|join: } | pbcopy"
mode = "fork"
separator = "\n"
