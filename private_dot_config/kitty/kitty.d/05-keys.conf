# Keybindings (matching WezTerm setup)

# Clear default kitty keybinds to avoid conflicts
clear_all_shortcuts no

# macOS option as alt (needed for word navigation)
macos_option_as_alt yes

# --- Text Navigation ---
map cmd+left  send_text all \x01
map cmd+right send_text all \x05
map alt+left  send_text all \x1bb
map alt+right send_text all \x1bf
map cmd+z     send_text all \x1f
map shift+enter send_text all \x1b[13;2u

# --- Pane (Window) Management ---
map cmd+t       launch --location=vsplit --cwd=current
map cmd+d       launch --location=hsplit --cwd=current
map cmd+]       next_window
map cmd+[       previous_window
map cmd+w       close_window_with_confirmation
map cmd+shift+w close_tab

# --- Tab Management ---
map cmd+shift+t   new_tab_with_cwd
map cmd+shift+[   previous_tab
map cmd+shift+]   next_tab

# --- Direct Tab Switching ---
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 10

# --- Zoom / Stack Toggle ---
map cmd+shift+z   toggle_layout stack

# --- Search / Copy Mode ---
map cmd+f         show_scrollback
map cmd+shift+x   no_op

# --- Resize Panes ---
map cmd+shift+left  resize_window narrower 2
map cmd+shift+right resize_window wider 2
map cmd+shift+up    resize_window taller 2
map cmd+shift+down  resize_window shorter 2

# --- Workspace Sessions (launch new OS window with session) ---
map cmd+ctrl+1 launch --type=os-window kitty --session ~/.config/kitty/sessions/default.session
map cmd+ctrl+2 launch --type=os-window kitty --session ~/.config/kitty/sessions/personal.session
map cmd+ctrl+3 launch --type=os-window kitty --session ~/.config/kitty/sessions/work.session
map cmd+ctrl+4 launch --type=os-window kitty --session ~/.config/kitty/sessions/scratch.session
map cmd+ctrl+5 launch --type=os-window kitty --session ~/.config/kitty/sessions/monitoring.session

# --- Mouse ---
mouse_map cmd+click open_url
