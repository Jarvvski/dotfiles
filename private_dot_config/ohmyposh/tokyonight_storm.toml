# console_title_template = ' {{ .Folder }} :: {{if .Root}}Admin{{end}}'
terminal_background = 'p:t-background'
version = 3
final_space = true

[palette]
  blue-bell = '#9aa5ce'
  blue-black = '#565f89'
  celeste-blue = '#b4f9f8'
  light-sky-blue = '#7dcfff'
  main-bg = '#24283b'
  pastal-grey = '#cfc9c2'
  pistachio-green = '#9ece6a'
  t-background = 'p:main-bg'
  terminal-black = '#414868'
  terminal-blue = '#7aa2f7'
  terminal-green = '#73daca'
  terminal-magenta = '#bb9af7'
  terminal-red = '#f7768e'
  terminal-white = '#c0caf5'
  terminal-yellow = '#e0af68'
  white-blue = '#a9b1d6'

[secondary_prompt]
  template = '➜ '
  foreground = 'p:terminal-blue'
  background = 'transparent'

[transient_prompt]
  template = '➜ '
  foreground = 'p:terminal-blue'
  background = 'transparent'

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    style = 'plain'
    template = "            {{- if matchP \"^~/Code(/|$)\" .PWD -}}\n              in \n            {{- else if matchP \"^~/Documents(/|$)\" .PWD -}}\n              in 󱔗\n            {{- else if matchP \"^~/Pictures(/|$)\" .PWD -}}\n              in \n            {{- else if matchP \"^~/Desktop(/|$)\" .PWD -}}\n              in \n            {{- else if matchP \"^~/Movies(/|$)\" .PWD -}}\n              in 󰿎\n            {{- else -}}\n            {{ \"in\" }}\n            {{- end }} "
    foreground = 'p:terminal-blue'
    background = 'transparent'
    type = 'text'

  [[blocks.segments]]
    style = 'plain'
    template = '<b>{{ trimPrefix "/" .Path }}</b>'
    foreground = 'p:terminal-magenta'
    type = 'path'

    [blocks.segments.properties]
      folder_icon = ''
      hide_root_location = true
      max_depth = 2
      style = 'agnoster_short'

  [[blocks.segments]]
    style = 'plain'
    template = ' '
    foreground = 'p:terminal-red'
    type = 'status'

[[blocks]]
  type = 'prompt'
  alignment = 'right'
  overflow = 'hide'

  [[blocks.segments]]
    style = 'plain'
    foreground = 'p:white-blue'
    type = 'command'

    [blocks.segments.properties]
      command = 'git log --pretty=format:%cr -1 || date +%H:%M:%S'
      shell = 'bash'

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    style = 'plain'
    template = ' 󱞩'
    foreground = 'p:pistachio-green'
    type = 'text'
